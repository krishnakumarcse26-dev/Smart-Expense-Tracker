{% extends "base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h5 class="fw-bold mb-4">{{ title }}</h5>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-semibold">Category</label>
          {{ form.category }}
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Budget Amount (&#8377;)</label>
          {{ form.amount }}
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small fw-semibold">Month</label>
            {{ form.month }}
          </div>
          <div class="col-6">
            <label class="form-label small fw-semibold">Year</label>
            {{ form.year }}
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn" style="background:linear-gradient(135deg,#00d4aa,#7c3aed);border:none;color:#fff;font-weight:700;padding:10px 28px;border-radius:8px;">Save Budget</button>
          <a href="{% url "budget_list" %}" class="btn btn-outline-secondary" style="border-radius:8px;">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
