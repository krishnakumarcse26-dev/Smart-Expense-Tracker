{% extends "base.html" %}
{% block public_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;padding:20px;">
  <div style="width:100%;max-width:400px;">
    <div style="text-align:center;margin-bottom:32px;">
      <h1 style="font-size:24px;font-weight:700;color:#fff;">Reset Password</h1>
      <p style="color:rgba(255,255,255,0.5);">Enter your email to receive reset instructions</p>
    </div>
    <div style="background:#1a1f2e;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:32px;">
      <form method="post">{% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email Address</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <button type="submit" class="btn w-100" style="background:linear-gradient(135deg,#00d4aa,#7c3aed);border:none;color:#fff;font-weight:700;padding:12px;border-radius:8px;">Send Reset Email</button>
      </form>
    </div>
    <p style="text-align:center;margin-top:20px;"><a href="{% url "login" %}" style="color:#00d4aa;">Back to Login</a></p>
  </div>
</div>
{% endblock %}
