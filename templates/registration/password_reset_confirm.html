{% extends "base.html" %}
{% block public_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;padding:20px;">
  <div style="width:100%;max-width:400px;">
    <h2 style="color:#fff;font-weight:700;text-align:center;margin-bottom:24px;">Set New Password</h2>
    <div style="background:#1a1f2e;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:32px;">
      <form method="post">{% csrf_token %}
        {% for field in form %}
        <div class="mb-3"><label class="form-label small fw-semibold">{{ field.label }}</label>{{ field }}</div>
        {% endfor %}
        <button type="submit" class="btn w-100" style="background:linear-gradient(135deg,#00d4aa,#7c3aed);border:none;color:#fff;font-weight:700;padding:12px;border-radius:8px;">Set Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
