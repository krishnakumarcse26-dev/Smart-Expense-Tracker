{% extends "base.html" %}
{% block public_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;padding:20px;">
    <div style="width:100%;max-width:440px;">
        <div style="text-align:center;margin-bottom:32px;">
            <div style="width:52px;height:52px;background:linear-gradient(135deg,#00d4aa,#7c3aed);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px;">&#128176;</div>
            <h1 style="font-size:26px;font-weight:700;color:#fff;">Create your account</h1>
            <p style="color:rgba(255,255,255,0.5);margin-top:4px;">Free forever. No credit card required.</p>
        </div>
        <div style="background:#1a1f2e;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:32px;">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label" style="color:rgba(255,255,255,0.8);font-size:13px;font-weight:600;">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<div style="color:#ef4444;font-size:12px;margin-top:4px;">{{ error }}</div>{% endfor %}
                </div>
                {% endfor %}
                <button type="submit" class="btn w-100 mt-2" style="background:linear-gradient(135deg,#00d4aa,#7c3aed);border:none;padding:12px;font-weight:700;border-radius:8px;color:#fff;">Create Account</button>
            </form>
        </div>
        <p style="text-align:center;margin-top:20px;color:rgba(255,255,255,0.5);">Already have an account? <a href="{% url 'login' %}" style="color:#00d4aa;font-weight:600;">Sign in</a></p>
    </div>
</div>
{% endblock %}
