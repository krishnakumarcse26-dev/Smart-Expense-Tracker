{% extends "base.html" %}
{% block public_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;padding:20px;">
    <div style="width:100%;max-width:400px;">
        <div style="text-align:center;margin-bottom:32px;">
            <div style="width:52px;height:52px;background:linear-gradient(135deg,#00d4aa,#7c3aed);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px;">&#128176;</div>
            <h1 style="font-size:26px;font-weight:700;color:#fff;">Welcome back</h1>
            <p style="color:rgba(255,255,255,0.5);">Sign in to SmartExpense</p>
        </div>
        <div style="background:#1a1f2e;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:32px;">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" style="color:rgba(255,255,255,0.8);font-size:13px;font-weight:600;">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label" style="color:rgba(255,255,255,0.8);font-size:13px;font-weight:600;">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn w-100" style="background:linear-gradient(135deg,#00d4aa,#7c3aed);border:none;padding:12px;font-weight:700;border-radius:8px;color:#fff;">Sign In</button>
            </form>
        </div>
        <p style="text-align:center;margin-top:20px;color:rgba(255,255,255,0.5);">New here? <a href="{% url 'register' %}" style="color:#00d4aa;font-weight:600;">Create an account</a></p>
    </div>
</div>
{% endblock %}
